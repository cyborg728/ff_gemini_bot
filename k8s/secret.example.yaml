# Пример секрета — НЕ КОММИТЬ реальные значения.
# Создай свой: kubectl -n ff-gemini-bot create secret generic ff-gemini-bot \
#   --from-literal=TELEGRAM_BOT_TOKEN=xxx \
#   --from-literal=GEMINI_API_KEY=yyy
apiVersion: v1
kind: Secret
metadata:
  name: ff-gemini-bot
  namespace: ff-gemini-bot
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "replace-me"
  GEMINI_API_KEY: "replace-me"
