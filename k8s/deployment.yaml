apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-gemini-bot
  namespace: ff-gemini-bot
  labels:
    app.kubernetes.io/name: ff-gemini-bot
spec:
  replicas: 1
  # Единственный поллинг-инстанс: два одновременно работающих Telegram-поллера
  # начнут конфликтовать (getUpdates conflict), поэтому Recreate, а не RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ff-gemini-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ff-gemini-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bot
          image: ghcr.io/cyborg728/ff_gemini_bot:latest
          # Тег `:latest` перекатывается на месте, поэтому Always — иначе
          # `rollout restart` поднимет под со старым кешем образа на ноде.
          # При переходе на пиннинг по digest/sha-тегу можно вернуть IfNotPresent.
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ff-gemini-bot
            - secretRef:
                name: ff-gemini-bot
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ff-gemini-bot-data
