apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ff-gemini-bot-data
  namespace: ff-gemini-bot
spec:
  accessModes:
    - ReadWriteOnce
  # В k3s по умолчанию используется StorageClass `local-path`.
  # Если нужен другой — раскомментируй и подставь.
  # storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
